<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAFAFA">
<title>Perimeter</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFAFA;--card:#FFFFFF;--ink:#0A0A0A;--muted:#5C5C66;--faint:#8A8A93;
  --line:#EDEDEF;--line-2:#DCDCE0;--fill:#F0F0F2;
  --accent:#3D5AFE;--accent-soft:#EEF1FF;--accent-ink:#2A40C7;
  --red:#D93025;--red-soft:#FDEEEC;--green:#188038;--green-soft:#E8F5EC;
  --shadow-pop:0 12px 32px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.04);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
input{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:999px}
h1,h2,p{margin:0}

.hdr{position:sticky;top:0;z-index:30;background:rgba(250,250,250,.85);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.hdr-in{max-width:1240px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;text-decoration:none;flex:1 1 0;color:var(--ink)}
.logo i{width:18px;height:18px;border-radius:6px;border:2px solid var(--ink);display:block;position:relative;flex-shrink:0}
.logo i::after{content:"";position:absolute;inset:3px;border-radius:2px;background:var(--accent);transform:scale(0);transition:transform .4s var(--ease)}
.logo:hover i::after{transform:scale(1)}
.seg{display:flex;gap:2px;padding:3px;background:var(--fill);border-radius:999px}
.seg a{text-decoration:none;font-size:13px;font-weight:500;padding:6px 14px;border-radius:999px;color:var(--muted);transition:color .15s,background .15s,box-shadow .15s;white-space:nowrap}
.seg a:hover{color:var(--ink)}
.seg .on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.hdr-right{flex:1 1 0;display:flex;justify-content:flex-end;align-items:center;gap:10px}
.askbtn{display:flex;align-items:center;gap:10px;height:36px;padding:0 8px 0 14px;border:1px solid var(--line-2);background:var(--card);border-radius:999px;font-size:13px;color:var(--muted);transition:border-color .15s,color .15s}
.askbtn:hover{border-color:var(--ink);color:var(--ink)}
.kbd{font-size:11px;border:1px solid var(--line-2);border-radius:6px;padding:1px 6px;color:var(--faint);font-family:inherit}
.who{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 3px;border:1px solid var(--line-2);background:var(--card);border-radius:999px;font-size:13px;font-weight:500;color:var(--ink);max-width:240px;text-decoration:none;transition:border-color .15s}
.who:hover{border-color:var(--ink)}
.who-av{width:28px;height:28px;border-radius:999px;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;letter-spacing:.02em;flex-shrink:0}
.who-av.f{background:var(--accent)}.who-av.demo{background:var(--fill);color:var(--muted)}
.who-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.demo-badge{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-size:11px;font-weight:600;flex-shrink:0}
@media (max-width:720px){.hdr-in{padding:0 14px;gap:8px}.askbtn,.who-t,.demo-badge{display:none}.who{padding:0 3px}.seg a{padding:6px 10px}}
.brief{display:inline-flex;align-items:center;gap:8px;margin-top:26px;font-size:14px;color:var(--muted);text-decoration:none;padding:8px 14px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);transition:transform .15s var(--ease)}
.brief::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.brief:hover{transform:translateY(-1px)}
.setup{display:block;margin-top:18px;font-size:14px;color:var(--muted)}
.dockin{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px;pointer-events:auto}
.dockin .ask{flex:1;margin:0;max-width:none}
.ghost{font-size:13px;font-weight:500;color:var(--muted);padding:7px 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);transition:border-color .15s,color .15s}
.ghost:hover{border-color:var(--ink);color:var(--ink)}
main{max-width:880px;margin:0 auto;padding:0 20px 140px}

/* ask box */
.ask{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--ink);border-radius:999px;padding:6px 6px 6px 22px;box-shadow:0 0 0 4px rgba(61,90,254,.08),var(--shadow-pop);transition:box-shadow .2s}
.ask:focus-within{box-shadow:0 0 0 4px rgba(61,90,254,.18),var(--shadow-pop)}
.ask input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px;height:44px}
.ask input::placeholder{color:var(--faint)}
.go{height:44px;padding:0 22px;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;font-size:15px;transition:transform .15s var(--ease),opacity .15s}
.go:active{transform:scale(.96)}.go:disabled{opacity:.35;cursor:default}

/* home */
.hero{text-align:center;padding-top:11vh}
.hero h1{font-size:clamp(34px,6.4vw,54px);line-height:1.05;font-weight:600;letter-spacing:-.035em;max-width:14em;margin:0 auto}
.hero p{color:var(--muted);font-size:17px;margin:16px auto 34px;max-width:30em}
.hero .ask{max-width:640px;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.hero .chips{justify-content:center;max-width:680px;margin:22px auto 0}
.chip{font-size:14px;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line-2);color:var(--muted);transition:border-color .15s,color .15s,transform .15s var(--ease)}
.chip:hover{border-color:var(--ink);color:var(--ink)}.chip:active{transform:scale(.97)}

/* answer */
.q{color:var(--muted);font-size:15px;margin-top:26px;display:flex;align-items:center;gap:10px}
.steps{height:24px;margin-top:6px;font-size:14px;color:var(--accent-ink);display:flex;align-items:center;gap:8px;overflow:hidden}
.steps i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.1s ease-in-out infinite;flex-shrink:0}
.steps span{animation:rise .3s var(--ease) both}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.in{animation:bloom .55s var(--ease) both}
@keyframes bloom{from{opacity:0;filter:blur(10px);transform:translateY(10px) scale(.985)}}
.head{margin-top:14px}
.head h2{font-size:clamp(26px,4.6vw,40px);line-height:1.14;font-weight:600;letter-spacing:-.03em}
.tone{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;margin-bottom:12px}
.tone::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.tone.bad{background:var(--red-soft);color:var(--red)}.tone.good{background:var(--green-soft);color:var(--green)}
.grid{display:flex;flex-wrap:wrap;gap:14px;margin-top:26px;align-items:flex-start}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0;flex:1 1 270px}
.card.wide{flex-basis:100%}
.ttl{font-size:13px;font-weight:500;color:var(--muted);margin-bottom:14px}
.srcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.src{font-size:12px;color:var(--muted);padding:3px 9px;border-radius:999px;background:var(--fill);text-decoration:none;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s,color .15s}
.src:hover{background:var(--accent-soft);color:var(--accent-ink)}
.head .srcs{margin-top:16px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:18px}
.stats b{display:block;font-size:34px;line-height:1.05;font-weight:600;letter-spacing:-.03em}
.stats span{font-size:13px;color:var(--muted)}.stats em{display:block;font-style:normal;font-size:12px;color:var(--faint)}
.bar{display:grid;grid-template-columns:minmax(70px,34%) 1fr auto;gap:10px;align-items:center;font-size:14px;padding:5px 0}
.bar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar i{display:block;height:10px;border-radius:999px;background:var(--accent-soft);position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;width:var(--w);border-radius:999px;background:var(--accent);transform-origin:left;animation:fill .8s var(--ease) both .15s}
@keyframes fill{from{transform:scaleX(0)}}
.bar b{font-weight:500;text-align:right}
.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:4px;top:8px;bottom:8px;width:1px;background:var(--line-2)}
.ev{position:relative;padding:5px 0}
.ev::before{content:"";position:absolute;left:-20px;top:11px;width:9px;height:9px;border-radius:50%;background:var(--card);border:2px solid var(--ink)}
.ev:first-child::before{background:var(--accent);border-color:var(--accent)}
.ev time{font-size:12px;color:var(--faint);display:block}
.ev b{font-weight:500}.ev p{font-size:13px;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;padding:9px 0;width:100%;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0;padding-top:0}
button.row:hover .t1{color:var(--accent-ink)}
.av{width:34px;height:34px;border-radius:10px;background:var(--fill);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted);flex-shrink:0}
.tx{flex:1;min-width:0}.t1{font-weight:500;transition:color .15s}.t2{font-size:13px;color:var(--muted)}
.val{font-size:13px;font-weight:500;white-space:nowrap;text-align:right}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:500;color:var(--muted);font-size:12px;text-align:left;padding:0 10px 8px 0}
td{padding:9px 10px 9px 0;border-top:1px solid var(--line);vertical-align:top}
td:first-child{font-weight:500}
.scroll{overflow-x:auto}
.path{display:flex;align-items:center;flex-wrap:wrap;gap:8px 4px}
.node{padding:9px 16px;border-radius:999px;font-weight:500;border:1px solid var(--line-2);background:var(--card);white-space:nowrap}
.node.investor{background:var(--ink);color:#fff;border-color:var(--ink)}
.node.rival{background:var(--red-soft);color:var(--red);border-color:transparent}
.node.you{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.node.person{background:var(--fill);border-color:transparent}
.link{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--faint);padding:0 4px;line-height:1.2}
.link::after{content:"";width:100%;min-width:34px;height:1px;background:var(--line-2);margin-top:3px}
.next{margin-top:26px}
.next .ttl{margin-bottom:10px}
.err{margin-top:20px;color:var(--muted)}
.err button{text-decoration:underline;color:var(--ink);font-weight:500;margin-left:6px}
.sk{border-radius:10px;background:linear-gradient(90deg,var(--fill) 25%,#E8E8EB 50%,var(--fill) 75%);background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.dock{position:fixed;left:0;right:0;bottom:0;padding:14px 20px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 62%,transparent);pointer-events:none}

/* graph of the search (js/askgraph.js) */
.ag{margin-top:14px;padding:0;overflow:hidden}
.ag-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;padding:16px 18px 12px}
.ag-top .ttl{margin-bottom:2px;color:var(--ink);font-weight:600;font-size:14px}
.ag-count{font-size:13px;color:var(--muted)}
.ag-tools,.ag-acts{display:flex;gap:6px;flex-wrap:wrap}
.ag-btn{font-size:12px;font-weight:500;padding:6px 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);color:var(--muted);white-space:nowrap;transition:border-color .15s,color .15s}
.ag-btn:hover{border-color:var(--ink);color:var(--ink)}
.ag-btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.ag-btn:disabled{opacity:.5;cursor:default}
.ag-stage{position:relative;height:500px;display:flex;flex-direction:column;overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:radial-gradient(circle at 1px 1px,#E6E6EA 1px,transparent 0) 0 0/22px 22px,var(--bg)}
.ag-stage svg{width:100%;flex:1;min-height:0;display:block;touch-action:none;cursor:grab}
.ag-stage svg.drag{cursor:grabbing}
.ag-edge{stroke:#D5D5DB;stroke-width:1;transition:opacity .2s}
.ag-edge.role{stroke:#E0E0E5}
.ag-edge.rival{stroke:#E9A29C;stroke-dasharray:4 4}
.ag-edge.hot{stroke:var(--accent);stroke-opacity:.45}
.ag-edge.mentions{stroke:#1BAF7A;stroke-opacity:.6;stroke-dasharray:2 4}
.ag-node{cursor:pointer;outline:none;transition:opacity .2s}
.ag-node text{pointer-events:none}
.ag-node.sel :not(.halo,text),.ag-node:focus-visible :not(.halo,text){stroke:var(--accent);stroke-width:3}
.ag-label{font-size:11px;fill:var(--muted);pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;transition:opacity .2s}
.ag-label.hub{font-size:13px;font-weight:600;fill:var(--ink)}
.ag-label.new{fill:var(--accent-ink);font-weight:500}
.ag-label.q{fill:var(--ink);font-style:italic}
.dim .ag-node.fade{opacity:.12}
.dim .ag-edge.fade{opacity:.06}
.dim .ag-edge.lit{stroke:var(--ink);stroke-opacity:.7;stroke-width:1.5}
.ag-legend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:6px 16px 10px;font-size:12px;color:var(--muted)}
.ag-legend span{display:inline-flex;align-items:center;gap:6px}
.ag-legend i{width:10px;height:10px;border-radius:50%;display:block;background:#C9C9D1}
.ag-legend .hub{background:var(--ink);border-radius:3px}
.ag-legend .inv{background:#fff;box-shadow:inset 0 0 0 1.5px var(--ink)}
.ag-legend .riv{background:var(--red)}
.ag-legend .res{background:#1BAF7A;border-radius:2px;transform:rotate(45deg) scale(.85)}
.ag-legend .top{background:#fff;border-radius:2px;box-shadow:inset 0 0 0 1.5px #8A8A93;width:8px;height:8px}
.ag-legend .per{background:#8A8A93;width:7px;height:7px}
.ag-legend .new{background:#fff;box-shadow:inset 0 0 0 2.5px var(--accent),0 0 0 3px var(--accent-soft)}
.ag-side{position:absolute;top:10px;right:10px;bottom:10px;width:min(320px,calc(100% - 20px));overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-pop);padding:16px;z-index:2}
.ag-side h3{margin:2px 28px 8px 0;font-size:18px;line-height:1.2;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere}
.ag-kind{font-size:12px;color:var(--muted);margin-right:28px}
.ag-x{position:absolute;top:8px;right:10px;width:28px;height:28px;text-align:center;font-size:20px;line-height:1;color:var(--muted);border-radius:999px}
.ag-x:hover{background:var(--fill);color:var(--ink)}
.ag-badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);margin-bottom:10px}
.ag-acts{margin-bottom:12px}
.ag-note{font-size:12px;color:var(--muted);margin-bottom:10px}
.ag-rows-t{font-size:12px;color:var(--faint);padding-top:10px;border-top:1px solid var(--line)}
.ag-row{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line)}
.ag-row:first-child{border-top:0}
.ag-row button{flex:1;min-width:0;padding:7px 0}
.ag-row b{display:block;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .15s}
.ag-row button:hover b{color:var(--accent-ink)}
.ag-row span,.ag-row p{display:block;font-size:12px;color:var(--muted)}
.ag-row p{flex:1;min-width:0;padding:7px 0;color:var(--ink)}
.ag-side.wide{width:min(400px,calc(100% - 20px))}
.ag-text{font-size:13px;line-height:1.5;margin:6px 0 4px}
.ag-text p{margin:0 0 6px}
.ag-text .h{font-weight:600;margin-top:10px}
.ag-text .li{padding-left:12px;position:relative}
.ag-text .li::before{content:"";position:absolute;left:2px;top:8px;width:4px;height:4px;border-radius:50%;background:var(--faint)}
.ag-text.clip{max-height:132px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.ag-more{font-size:12px;font-weight:500;color:var(--accent-ink);margin-bottom:10px}
.ag-srcs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.ag-srcs a{font-size:12px;color:var(--muted);padding:3px 9px;border-radius:999px;background:var(--fill);text-decoration:none;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-srcs a:hover{background:var(--accent-soft);color:var(--accent-ink)}
.ag-rows+.ag-rows-t,.ag-text+.ag-rows-t,.ag-more+.ag-rows-t,.ag-srcs+.ag-rows-t{margin-top:10px}
.ag-row a{flex-shrink:0;text-decoration:none;font-size:12px;color:var(--muted);width:24px;height:24px;display:grid;place-items:center;border-radius:999px;background:var(--fill)}
.ag-row a:hover{background:var(--accent-soft);color:var(--accent-ink)}
.ag-tip{position:absolute;pointer-events:none;z-index:3;max-width:260px;background:var(--ink);color:#fff;font-size:12px;line-height:1.4;padding:8px 10px;border-radius:10px}
.ag-tip b,.ag-tip span{display:block}
.ag-tip span{opacity:.75}
.ag-tip .n{color:#9DB0FF;opacity:1}
.ag-finds{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px 16px}
.ag-finds-t{flex-basis:100%;font-size:13px;color:var(--muted)}
.ag-find{flex:1 1 220px;min-width:0;padding:10px 12px;border-radius:12px;background:var(--accent-soft);transition:transform .15s var(--ease)}
.ag-find:hover{transform:translateY(-1px)}
.ag-find:focus-visible,.ag-row button:focus-visible{border-radius:12px}
.ag-find b{display:block;font-size:14px;font-weight:600;color:var(--accent-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-find span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;color:var(--muted)}
.ag.ag-full{position:fixed;inset:0;z-index:60;margin:0;border:0;border-radius:0;display:flex;flex-direction:column;animation:none}
.ag-full .ag-stage{flex:1;height:auto;min-height:0}
.ag-full .ag-finds{max-height:30vh;overflow-y:auto}
.ag-lock{overflow:hidden}
@media (max-width:720px){.ag-stage{height:440px}.ag-stage svg{touch-action:pan-y}.ag-side{top:auto;left:10px;width:auto;max-height:70%}.ag-legend{font-size:11px;gap:2px 8px}}

.foot{margin-top:44px;font-size:12px;color:var(--faint);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="hdr"><div class="hdr-in">
  <a class="logo" href="/" id="home" aria-label="Perimeter home"><i></i>Perimeter</a>
  <nav class="seg" aria-label="Main"><a class="on" aria-current="page" href="/">Ask</a><a href="/app#/">Feed</a><a href="/app#/map">Map</a><a href="/app#/check">Check</a></nav>
  <div class="hdr-right"><button type="button" class="askbtn" id="focusAsk">Ask anything <kbd class="kbd">Ctrl K</kbd></button><a class="who" id="who" href="/app#/profile" hidden></a></div>
</div></header>
<main id="app"></main>
<div class="dock" id="dock" hidden><div class="dockin"><button class="ghost" id="new" hidden>New question</button><form class="ask"><input placeholder="Ask a follow-up" aria-label="Ask a follow-up" autocomplete="off"><button class="go">Ask</button></form></div></div>
<script src="/js/askgraph.js?v=2"></script>
<script>
// Old links such as /#/map pointed at the app when it lived on the front page.
if (location.hash.startsWith('#/')) location.replace('/app' + location.hash);
const $ = document.getElementById('app'), dock = document.getElementById('dock'), newBtn = document.getElementById('new');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = n => String(n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const EXAMPLES = ['Does TCV back any rival of Qonto?', 'Who invested in Pennylane, and when?', 'How active is Greenoaks this year?', 'Compare Mollie and Adyen'];
const history = [];   // {q, headline} of finished answers, sent as context for follow-ups
const G = AskGraph.create({ load: id => fetch('/api/agent/graph/' + encodeURIComponent(id)).then(r => { if (!r.ok) throw new Error('graph'); return r.json(); }) });  // everything the answers read from Cala, kept across follow-ups
let run = 0;          // bumps on every question so a superseded stream stops drawing
let profile = null;   // who is asking (company, portfolio), when the app has a profile for this browser
const profileReady = fetch('/api/profile').then(r => r.ok ? r.json() : null).then(p => { me = p; profile = p && (p.context || null); paintWho(); if (atHome) home(); }).catch(() => {});
let me = null, atHome = true, brief = null;
fetch('/api/feed').then(r => r.ok ? r.json() : null).then(f => { brief = f && !f.building && f.items && f.items.length ? f.summary : null; if (atHome) home(); }).catch(() => {});

// The same profile chip the app shows, so the top bar does not change between pages.
function paintWho() {
  const el = document.getElementById('who'), p = me && me.profile, demo = !me || me.viewing === 'demo' || !p;
  const label = demo ? 'Demo portfolio' : p.name || (p.role === 'founder' ? p.my_company && p.my_company.name : p.fund_or_company_name) || (p.role === 'founder' ? 'Founder' : 'Investor');
  const person = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>';
  el.innerHTML = `<span class="who-av${demo ? ' demo' : p.role === 'founder' ? ' f' : ''}">${demo ? person : esc(initials(label))}</span><span class="who-t">${esc(label)}</span>${demo ? '<span class="demo-badge">Demo</span>' : ''}`;
  el.setAttribute('aria-label', 'Profile: ' + label);
  el.hidden = false;
}

// What the front page says depends on who is asking: Perimeter is about what surrounds *your* company.
function pitch() {
  const c = profile || {}, mine = !c.demo, rival = ((c.rivals || [])[0] || {}).name;
  const co = typeof c.my_company === 'string' ? c.my_company : c.my_company && c.my_company.name;
  if (mine && co) return { h: `Everything around ${co}. Just ask.`, p: `Perimeter watches ${co}'s rivals, investors and deals in Cala's knowledge graph.`,
    qs: ['Which of my investors also back my rivals?', rival ? `Who funds ${rival}?` : 'Who are my closest rivals?', 'Which of my rivals raised money this year?', 'Which active investors back companies like mine, but none of my rivals?'] };
  const names = (c.portfolio || []).map(x => x.name).filter(Boolean);
  if (names.length) return { h: mine ? 'Everything around your portfolio. Just ask.' : 'Everything around your company. Just ask.',
    p: `Perimeter watches the rivals, investors and deals around ${names.slice(0, 3).join(', ')}${names.length > 3 ? ' and more' : ''} in Cala's knowledge graph.`,
    qs: [`Which investors in ${names[0]} also back its rivals?`, rival ? `What has ${rival} raised recently?` : `Who are ${names[0]}'s closest rivals?`, names[1] ? `Compare ${names[0]} and ${names[1]}` : `Who invested in ${names[0]}, and when?`, `Who co-invests most often around ${names[names.length - 1]}?`] };
  return { h: 'Everything around your company. Just ask.', p: "Perimeter watches a company's rivals, investors and deals in Cala's knowledge graph.", qs: EXAMPLES };
}

/* ---------- widgets ---------- */
const sources = w => w.sources && w.sources.length ? `<div class="srcs">${w.sources.map(s => `<a class="src" href="${esc(s.url)}" target="_blank" rel="noopener" title="${esc(s.name)}">${esc(s.name)} ↗</a>`).join('')}</div>` : '';
const card = (w, body, wide) => `<section class="card in ${wide ? 'wide' : ''}">${w.title ? `<div class="ttl">${esc(w.title)}</div>` : ''}${body}${sources(w)}</section>`;
const render = {
  stats: w => card(w, `<div class="stats">${w.items.slice(0, 4).map(i => `<div><b>${esc(i.value)}</b><span>${esc(i.label)}</span>${i.note ? `<em>${esc(i.note)}</em>` : ''}</div>`).join('')}</div>`, w.items.length > 2),
  bars: w => { const max = Math.max(...w.items.map(i => Math.abs(i.value)), 1);
    return card(w, w.items.slice(0, 8).map(i => `<div class="bar"><span>${esc(i.label)}</span><i style="--w:${Math.max(2, Math.abs(i.value) / max * 100)}%"></i><b>${esc(i.display ?? i.value + (w.unit ? ' ' + w.unit : ''))}</b></div>`).join('')); },
  timeline: w => card(w, `<div class="tl">${w.events.slice(0, 8).map(e => `<div class="ev"><time>${esc(e.date)}</time><b>${esc(e.title)}</b>${e.detail ? `<p>${esc(e.detail)}</p>` : ''}</div>`).join('')}</div>`),
  list: w => card(w, w.rows.slice(0, 8).map(r => { const inner = `<div class="av">${esc(initials(r.title))}</div><div class="tx"><div class="t1">${esc(r.title)}</div>${r.subtitle ? `<div class="t2">${esc(r.subtitle)}</div>` : ''}</div>${r.value ? `<div class="val">${esc(r.value)}</div>` : ''}`;
    return r.id ? `<button class="row" data-ask="Tell me about ${esc(r.title)}">${inner}</button>` : `<div class="row">${inner}</div>`; }).join('')),
  table: w => card(w, `<div class="scroll"><table>${w.columns ? `<tr>${w.columns.map(c => `<th>${esc(c)}</th>`).join('')}</tr>` : ''}${w.rows.slice(0, 6).map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`, true),
  path: w => card(w, `<div class="path">${w.nodes.map((n, i) => `${i ? `<span class="link">${esc((w.links || [])[i - 1] || '')}</span>` : ''}<span class="node ${esc(n.kind || '')}">${esc(n.label)}</span>`).join('')}</div>`, true),
};
const skeleton = () => `<div class="head"><div class="sk" style="height:34px;width:88%"></div><div class="sk" style="height:34px;width:56%;margin-top:10px"></div></div>
  <div class="grid">${'<div class="card"><div class="sk" style="height:12px;width:40%"></div><div class="sk" style="height:12px;width:90%;margin-top:18px"></div><div class="sk" style="height:12px;width:70%;margin-top:10px"></div><div class="sk" style="height:12px;width:80%;margin-top:10px"></div></div>'.repeat(2)}</div>`;

/* ---------- home ---------- */
function home() {
  run++; history.length = 0; G.reset(); document.documentElement.classList.remove('ag-lock'); dock.hidden = true; newBtn.hidden = true;
  const typed = atHome && $.querySelector('.hero input') ? $.querySelector('.hero input').value : '', first = !atHome || !$.querySelector('.hero');
  atHome = true;
  const t = pitch(), demo = !profile || profile.demo;
  $.innerHTML = `<div class="hero ${first ? 'in' : ''}"><h1>${esc(t.h)}</h1>
    <p>${esc(t.p)} Every answer comes with its sources.</p>
    <form class="ask"><input placeholder="${esc(t.qs[0])}" aria-label="Your question" autocomplete="off"><button class="go">Ask</button></form>
    <div class="chips">${t.qs.map(q => `<button class="chip" data-ask="${esc(q)}">${esc(q)}</button>`).join('')}</div>
    ${brief ? `<a class="brief" href="/app#/">${esc(brief)} See the feed →</a>` : ''}
    ${me && demo ? '<a class="setup" href="/app#/welcome">This is a demo portfolio. Set up your own company →</a>' : ''}</div>`;
  const input = $.querySelector('input'); input.value = typed; input.focus();
}

/* ---------- ask ---------- */
async function ask(q) {
  q = q.trim(); if (!q) return;
  const mine = ++run; atHome = false; document.documentElement.classList.remove('ag-lock');
  dock.hidden = false; newBtn.hidden = false; dock.querySelector('input').value = ''; dock.querySelector('.go').disabled = true;
  scrollTo({ top: 0 });
  $.innerHTML = `<div class="q in">${esc(q)}</div><div class="steps" id="steps"><i></i><span>Thinking</span></div><div id="board">${skeleton()}</div>`;
  const steps = document.getElementById('steps'), board = document.getElementById('board');
  let head = null, grid = null, headline = '', got = false;
  const first = () => { if (got) return; got = true; board.innerHTML = '<div class="head" id="head"></div><div class="grid" id="grid"></div><section class="card ag in" id="graph" hidden></section><div id="next"></div>'; head = document.getElementById('head'); grid = document.getElementById('grid'); if (G.size) showGraph(); };
  const showGraph = () => { const el = document.getElementById('graph'); if (el.hidden) { el.hidden = false; G.mount(el); } };
  const fail = msg => { if (mine !== run) return; steps.hidden = true; if (!got) board.innerHTML = ''; board.insertAdjacentHTML('beforeend', `<div class="err">${esc(msg)}<button data-ask="${esc(q)}">Try again</button></div>`); dock.querySelector('.go').disabled = false; };
  const on = (event, d) => {
    if (event === 'step') steps.innerHTML = `<i></i><span>${esc(d.text)}</span>`;
    else if (event === 'graph') { first(); G.merge(d); if (G.size) showGraph(); }
    else if (event === 'widget') {
      first(); G.say(JSON.stringify({ ...d, sources: null }));
      if (d.type === 'headline') { headline = d.text; head.innerHTML = `<div class="in">${d.tone === 'bad' ? '<span class="tone bad">Risk</span><br>' : d.tone === 'good' ? '<span class="tone good">Good sign</span><br>' : ''}<h2>${esc(d.text)}</h2>${sources(d)}</div>`; }
      else if (d.type === 'followups') document.getElementById('next').innerHTML = `<div class="next in"><div class="ttl">Ask next</div><div class="chips">${d.questions.slice(0, 3).map(x => `<button class="chip" data-ask="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>`;
      else if (render[d.type]) grid.insertAdjacentHTML('beforeend', render[d.type](d));
      steps.innerHTML = '<i></i><span>Building the answer</span>';
    } else if (event === 'error') fail(d.message);
    else if (event === 'done') { steps.hidden = true; history.push({ q, headline }); dock.querySelector('.go').disabled = false;
      board.insertAdjacentHTML('beforeend', '<div class="foot">Built from Cala\'s knowledge graph. Open any source to check it.</div>'); }
  };
  try {
    const res = await fetch('/api/agent', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ q, history: history.slice(-4), profile }) });
    if (!res.ok || !res.body) throw new Error('The server did not answer.');
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '', finished = false;
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      if (mine !== run) { reader.cancel(); return; }
      buf += dec.decode(value, { stream: true });
      let cut;
      while ((cut = buf.indexOf('\n\n')) >= 0) {
        const chunk = buf.slice(0, cut); buf = buf.slice(cut + 2);
        const ev = (chunk.match(/^event: (.+)$/m) || [])[1], data = (chunk.match(/^data: (.+)$/m) || [])[1];
        if (!ev || !data) continue;
        if (ev === 'done' || ev === 'error') finished = true;
        on(ev, JSON.parse(data));
      }
    }
    if (!finished) fail('The answer was cut off.');
  } catch (e) { fail(e.message || 'Something went wrong.'); }
}

const initialQ = new URLSearchParams(location.search).get('q');
if (initialQ) profileReady.then(() => ask(initialQ));
document.addEventListener('submit', e => { e.preventDefault(); const i = e.target.querySelector('input'); ask(i.value || (e.target.closest('.hero') ? i.placeholder : '')); });
document.addEventListener('click', e => { const b = e.target.closest('[data-ask]'); if (b) ask(b.dataset.ask); });
newBtn.onclick = home;
const focusAsk = () => { const i = dock.hidden ? $.querySelector('.hero input') : dock.querySelector('input'); if (i) i.focus(); };
document.getElementById('focusAsk').onclick = focusAsk;
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); focusAsk(); } });
document.getElementById('home').onclick = e => { e.preventDefault(); home(); };
home();
</script>
</body>
</html>
