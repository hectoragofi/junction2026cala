<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ECE8DF">
<title>Perimeter</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECE8DF;--dot:#DAD4C7;--card:#FBF9F5;--fill:#F2EEE6;--line:#E9E4DA;--ink:#1B1915;--muted:#756F64;--faint:#A9A397;
  --blue:#1B1915;--blue-soft:#E4DCCD;--red:#C2412D;--red-soft:#F9E7E1;--green:#2F7D55;--green-soft:#E4F0E5;
  --shadow:0 1px 2px rgba(40,30,10,.04),0 12px 32px rgba(40,30,10,.07);
  --spring:cubic-bezier(.34,1.4,.64,1);--ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
body{margin:0;color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  background:var(--bg) radial-gradient(var(--dot) 1px,transparent 1.5px) 0 0/22px 22px;min-height:100vh}
main{max-width:1080px;margin:0 auto;padding:14px 16px 96px}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
input{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:12px}
h1,h2,p{margin:0}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;height:48px;margin-bottom:18px}
.brand{font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{width:15px;height:15px;border-radius:5px;border:2px solid var(--ink);display:block;transition:border-radius .3s var(--spring)}
.brand:hover i{border-radius:50%}
.grow{flex:1}
.me{height:38px;padding:0 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;max-width:62vw;white-space:nowrap;transition:transform .2s var(--spring)}
.me:active{transform:scale(.96)}
.me b{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.me input{border:0;outline:0;background:none;width:150px;font-size:13px}

/* widgets */
.lab{font-size:12px;color:var(--muted);margin:0 6px 8px;display:flex;justify-content:space-between;gap:8px}
.w{break-inside:avoid;margin-bottom:22px;animation:bloom .6s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes bloom{from{opacity:0;filter:blur(14px);transform:scale(.96) translateY(8px)}}
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.pad{padding:18px}
.top{display:grid;gap:22px;grid-template-columns:1fr}
.cols{columns:3 300px;column-gap:22px}
@media (min-width:860px){.top{grid-template-columns:1.25fr 1fr}.top .w{margin-bottom:0}.top{margin-bottom:22px}}

/* lists */
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;width:100%;position:relative;transition:background .15s}
.row+.row::before,.srcs+.row::before{content:"";position:absolute;left:64px;right:16px;top:0;height:1px;background:var(--line)}
button.row:hover,a.row:hover{background:var(--fill)}
.list{padding:6px 0}
.av{width:36px;height:36px;border-radius:11px;background:var(--fill);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted);flex-shrink:0;letter-spacing:.02em}
.tx{flex:1;min-width:0}
.t1{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt{font-size:13px;color:var(--muted);white-space:nowrap;text-align:right}
.rt b{display:block;color:var(--ink);font-weight:500;font-size:15px}
.chev{color:var(--faint);flex-shrink:0}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--faint)}
.dot.bad{background:var(--red)}.dot.ok{background:var(--green)}
.srcs{padding:0 16px 10px 64px;font-size:13px}
.srcs a,.links a{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 0}
.srcs a:hover,.links a:hover{color:var(--blue)}
.empty{padding:16px;color:var(--muted);font-size:14px}
.pillx{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--fill);color:var(--muted);white-space:nowrap}
.pillx.ok{background:var(--green-soft);color:var(--green)}.pillx.bad{background:var(--red-soft);color:var(--red)}.pillx.blue{background:var(--blue-soft);color:var(--blue)}

/* home */
.hero{max-width:560px;margin:0 auto;padding-top:5vh}
.hero h1{font-size:clamp(38px,9vw,56px);line-height:1;font-weight:500;letter-spacing:-.035em;margin-top:26px}
.hero h1 em{font-family:'Instrument Serif',serif;font-weight:400;letter-spacing:-.01em}
.hero p{color:var(--muted);margin:14px 0 24px;font-size:16px;max-width:30em}
.field{position:relative}
.field input{width:100%;height:58px;border-radius:20px;border:0;background:var(--card);box-shadow:var(--shadow);font-size:16px;padding:0 18px 0 50px;outline:none;transition:box-shadow .2s}
.field input::placeholder{color:var(--faint)}
.field input:focus{box-shadow:var(--shadow),0 0 0 2px var(--ink)}
.field svg{position:absolute;left:18px;top:19px;color:var(--faint);pointer-events:none}
.sec{margin-top:26px}

/* texture */
.tex{display:block;width:100%;height:132px;border-radius:18px;background:radial-gradient(ellipse 70% 120% at 50% 115%,rgba(255,247,222,.85),transparent 70%),var(--tex-bg,#DDD3BF);transition:background-color .6s var(--ease);touch-action:pan-y}
.frame{padding:8px}

/* investor */
.id{display:flex;gap:14px;align-items:center;padding:14px 12px 10px}
.id .av{width:48px;height:48px;border-radius:14px;font-size:15px}
.id h1{font-size:24px;line-height:1.15;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.id p{color:var(--muted);font-size:14px;margin-top:2px}
.verdict{height:100%;display:flex;flex-direction:column;justify-content:space-between;gap:14px;transition:background .5s var(--ease)}
.verdict.bad{background:var(--red-soft)}.verdict.ok{background:var(--green-soft)}
.verdict .v{font-size:clamp(20px,2.4vw,25px);line-height:1.22;font-weight:500;letter-spacing:-.02em;margin-top:12px}
.verdict .s{font-size:14px;color:var(--muted);margin-top:8px}
.verdict form{display:flex;gap:8px}
.verdict input,.ask input{flex:1;min-width:0;height:44px;border-radius:14px;border:0;background:var(--fill);padding:0 14px;outline:none}
.verdict input:focus,.ask input:focus{box-shadow:0 0 0 2px var(--ink)}
.btn{height:44px;padding:0 18px;border-radius:14px;background:var(--ink);color:var(--card);font-weight:500;font-size:14px;transition:transform .2s var(--spring)}
.btn:active{transform:scale(.95)}
.big{font-size:56px;line-height:1;font-weight:400;letter-spacing:-.04em}
.big small{font-size:14px;color:var(--muted);letter-spacing:0;margin-left:6px}
.bars{display:flex;align-items:flex-end;gap:8px;height:92px;margin-top:18px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:11px;color:var(--faint)}
.bars i{display:block;width:100%;border-radius:7px;background:var(--blue-soft);min-height:4px;transform-origin:bottom;animation:grow .7s var(--spring) both}
.bars div:last-child i{background:var(--blue)}
@keyframes grow{from{transform:scaleY(0)}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 11px;border-radius:999px;background:var(--fill);font-size:13px;display:inline-flex;gap:6px;align-items:center;transition:background .15s,transform .2s var(--spring)}
button.chip:hover{background:#E9E4DA}button.chip:active{transform:scale(.95)}
.chip.bad{background:var(--red-soft);color:var(--red);font-weight:500}
.ask form{display:flex;gap:8px}
.answer{font-size:14px;line-height:1.55}
.answer p{margin:0 0 10px}.answer ul{margin:0 0 10px;padding-left:18px}.answer li{margin:2px 0}
.links{margin-top:10px;font-size:13px;border-top:1px solid var(--line);padding-top:10px}
.foot{margin-top:30px;color:var(--faint);font-size:12px;text-align:center}

/* terms with a definition */
.term{display:inline;border-bottom:2px dotted var(--faint);cursor:help;transition:border-color .15s}
.term:hover,.term:focus-visible{border-color:var(--ink)}
.tip{position:absolute;z-index:50;max-width:280px;background:var(--ink);color:#fff;font-size:13px;line-height:1.45;padding:10px 12px;border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.2);transform-origin:var(--ox,50%) 100%;animation:pop .28s var(--spring) both;pointer-events:none}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(6px)}}

/* skeleton + errors */
.sk{border-radius:8px;background:linear-gradient(90deg,var(--fill) 25%,#E9E4DA 50%,var(--fill) 75%);background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.err{color:var(--muted);font-size:14px}
.err button{color:var(--ink);font-weight:500;margin-left:6px;text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const $ = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const api = async path => {
  const r = await fetch('/api/investor' + path);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || 'Something went wrong');
  return r.json();
};
const initials = n => (n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate = d => d ? `${MONTHS[+d.slice(5, 7) - 1]} ${d.slice(0, 4)}` : '';
const srcList = list => (list || []).filter(s => s.url).slice(0, 4).map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}${s.date ? ' · ' + esc(fmtDate(s.date)) : ''} ↗</a>`).join('');
const term = (text, tip) => `<button class="term" data-tip="${esc(tip)}">${esc(text)}</button>`;
const icon = {
  search: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  chev: '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
};
const skRows = n => `<div class="list">${Array.from({length: n}, (_, i) => `<div class="row"><div class="av sk"></div><div class="tx"><div class="sk" style="height:12px;width:${45 + i * 9 % 30}%"></div><div class="sk" style="height:10px;width:${28 + i * 7 % 25}%;margin-top:8px"></div></div></div>`).join('')}</div>`;
const widget = (i, label, body, right = '') => `<section class="w" style="--i:${i}"><div class="lab"><span>${label}</span><span>${right}</span></div>${body}</section>`;

let me = store.get('me', '');
let view = 0; // bumps on every navigation so late responses from an old page are dropped

/* ---------- texture: a field of bars that turn toward the pointer ---------- */
function texture(canvas) {
  const ctx = canvas.getContext('2d'), still = matchMedia('(prefers-reduced-motion:reduce)').matches;
  let w = 0, h = 0, px = null, py = null, bars = [], raf = 0, alive = true;
  const size = () => {
    const r = canvas.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
    w = r.width; h = r.height; canvas.width = w * d; canvas.height = h * d; ctx.setTransform(d, 0, 0, d, 0, 0);
    bars = [];
    const gap = 17, cols = Math.floor((w - 20) / gap), rows = Math.floor((h - 20) / gap);
    const ox = (w - (cols - 1) * gap) / 2, oy = (h - (rows - 1) * gap) / 2;
    for (let c = 0; c < cols; c++) for (let r2 = 0; r2 < rows; r2++) bars.push({ x: ox + c * gap, y: oy + r2 * gap, a: Math.PI / 2, t: 0 });
  };
  const draw = time => {
    if (!alive || !canvas.isConnected) return;
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = getComputedStyle(canvas).getPropertyValue('--tex-ink') || '#2A251C';
    ctx.lineCap = 'round';
    for (const b of bars) {
      let target, near = 0;
      if (px !== null) {
        const dx = px - b.x, dy = py - b.y;
        target = Math.atan2(dy, dx); near = Math.max(0, 1 - Math.hypot(dx, dy) / 150);
      } else target = Math.PI / 2 + Math.sin(b.x * .018 + b.y * .012 + time * .0007) * .55;
      let diff = target - b.a; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      b.a += diff * .14; b.t += (near - b.t) * .16;
      const len = 5.5, cx = Math.cos(b.a) * len, cy = Math.sin(b.a) * len;
      ctx.lineWidth = 1.3 + b.t * 3; ctx.globalAlpha = .55 + b.t * .45;
      ctx.beginPath(); ctx.moveTo(b.x - cx, b.y - cy); ctx.lineTo(b.x + cx, b.y + cy); ctx.stroke();
    }
    if (!still) raf = requestAnimationFrame(draw);
  };
  const move = e => { const r = canvas.getBoundingClientRect(), p = e.touches ? e.touches[0] : e; px = p.clientX - r.left; py = p.clientY - r.top; };
  const leave = () => { px = py = null; };
  canvas.addEventListener('pointermove', move); canvas.addEventListener('pointerleave', leave);
  canvas.addEventListener('touchmove', move, { passive: true }); canvas.addEventListener('touchend', leave);
  const ro = new ResizeObserver(() => { size(); if (still) draw(0); }); ro.observe(canvas);
  size(); raf = requestAnimationFrame(draw);
  return () => { alive = false; cancelAnimationFrame(raf); ro.disconnect(); };
}
let stopTexture = null;
function mountTexture() { if (stopTexture) stopTexture(); const c = document.querySelector('canvas.tex'); stopTexture = c ? texture(c) : null; }

/* ---------- definitions on dotted terms ---------- */
let tip = null;
const hideTip = () => { if (tip) { tip.remove(); tip = null; } };
function showTip(el) {
  hideTip();
  tip = document.createElement('div'); tip.className = 'tip'; tip.setAttribute('role', 'tooltip'); tip.textContent = el.dataset.tip;
  document.body.append(tip);
  const r = el.getBoundingClientRect(), t = tip.getBoundingClientRect();
  const left = Math.max(12, Math.min(innerWidth - t.width - 12, r.left + r.width / 2 - t.width / 2));
  tip.style.left = left + scrollX + 'px'; tip.style.top = r.top + scrollY - t.height - 10 + 'px';
  tip.style.setProperty('--ox', r.left + r.width / 2 - left + 'px');
}
document.addEventListener('pointerover', e => { const t = e.target.closest('.term'); if (t) showTip(t); });
document.addEventListener('pointerout', e => { if (e.target.closest('.term')) hideTip(); });
document.addEventListener('focusin', e => { const t = e.target.closest('.term'); if (t) showTip(t); });
document.addEventListener('focusout', hideTip);
document.addEventListener('click', e => { const t = e.target.closest('.term'); if (t) { e.stopPropagation(); showTip(t); } else hideTip(); }, true);
document.addEventListener('keydown', e => e.key === 'Escape' && hideTip());

/* ---------- top bar ---------- */
const bar = () => `<div class="bar"><a class="brand" href="#"><i></i>Perimeter</a><span class="grow"></span>
  <button class="me" id="me">${me ? `You are <b>${esc(me)}</b>` : 'Add your company'}</button></div>`;
function wireBar() {
  const b = document.getElementById('me');
  b.onclick = () => {
    if (b.querySelector('input')) return;
    b.innerHTML = `<input aria-label="Your company" placeholder="Your company" value="${esc(me)}">`;
    const i = b.firstChild; i.focus(); i.select();
    const done = save => { if (save) { me = i.value.trim(); store.set('me', me); } route(); };
    i.onkeydown = e => { if (e.key === 'Enter') done(true); if (e.key === 'Escape') done(false); };
    i.onblur = () => done(true);
  };
}

/* ---------- home ---------- */
function home() {
  const recent = store.get('recent', []);
  $.innerHTML = `${bar()}<div class="hero">
    <section class="w card frame" style="--i:0"><canvas class="tex"></canvas></section>
    <section class="w" style="--i:1"><h1>They checked you.<br><em>Check them.</em></h1>
    <p>Look up any investor before the meeting: what they really fund, how active they are, and whether they back your rival.</p>
    <div class="field">${icon.search}<input id="q" placeholder="Search an investor" autocomplete="off"></div></section>
    <div id="res"></div>
    ${recent.length ? widget(2, 'Your list', `<div class="card list">${recent.map(r => `<a class="row" href="#i/${r.id}"><div class="av">${esc(initials(r.name))}</div>
      <div class="tx"><div class="t1">${esc(r.name)}</div><div class="t2">${esc(r.note || 'Checked')}</div></div>
      <span class="dot ${r.state || ''}"></span>${icon.chev}</a>`).join('')}</div>`, recent.length) : ''}
    <div class="foot">Every fact comes from Cala's knowledge graph, with its source.</div></div>`;
  wireBar(); mountTexture();
  const q = document.getElementById('q'), res = document.getElementById('res');
  let timer, seq = 0;
  const run = async () => {
    const text = q.value.trim(), mine = ++seq;
    if (text.length < 2) { res.innerHTML = ''; return; }
    res.innerHTML = widget(0, 'Results', `<div class="card">${skRows(3)}</div>`);
    try {
      const { results } = await api('/search?q=' + encodeURIComponent(text));
      if (mine !== seq) return;
      res.innerHTML = widget(0, 'Results', `<div class="card list">${results.length
        ? results.map(r => `<a class="row" href="#i/${r.id}"><div class="av">${esc(initials(r.name))}</div>
            <div class="tx"><div class="t1">${esc(r.name)}</div><div class="t2">${esc(r.description || '')}</div></div>${icon.chev}</a>`).join('')
        : `<div class="empty">Cala has no investor called “${esc(text)}”.</div>`}</div>`);
    } catch (e) {
      if (mine === seq) res.innerHTML = widget(0, 'Results', `<div class="card pad err">${esc(e.message)}</div>`);
    }
  };
  q.oninput = () => { clearTimeout(timer); timer = setTimeout(run, 350); };
  q.onkeydown = e => { if (e.key === 'Enter') { clearTimeout(timer); run(); } };
}

/* ---------- investor ---------- */
function remember(inv, state, note) {
  const list = store.get('recent', []).filter(r => r.id !== inv.id);
  list.unshift({ id: inv.id, name: inv.name, state, note });
  store.set('recent', list.slice(0, 12));
}
function tint(state) {
  const c = document.querySelector('canvas.tex'); if (!c) return;
  const [bg, ink] = { bad: ['#D9654F', '#2E0F09'], ok: ['#8DBF9C', '#0E2A1A'] }[state] || ['#DDD3BF', '#2A251C'];
  c.style.setProperty('--tex-bg', bg); c.style.setProperty('--tex-ink', ink);
}

async function investor(id) {
  const mine = ++view;
  $.innerHTML = `${bar()}<div class="top"><div class="card frame"><div class="sk" style="height:132px;border-radius:18px"></div>
      <div class="id"><div class="av sk"></div><div style="flex:1"><div class="sk" style="height:20px;width:40%"></div><div class="sk" style="height:12px;width:70%;margin-top:10px"></div></div></div></div>
    <div class="card pad"><div class="sk" style="height:14px;width:30%"></div><div class="sk" style="height:22px;width:90%;margin-top:16px"></div><div class="sk" style="height:22px;width:60%;margin-top:8px"></div></div></div>
    <div class="cols" style="margin-top:22px">${'<div class="w card">' + skRows(3) + '</div>'.repeat(1)}<div class="w card">${skRows(4)}</div><div class="w card">${skRows(2)}</div></div>`;
  wireBar();
  let inv;
  try { inv = await api('/' + id); } catch (e) {
    if (mine !== view) return;
    $.innerHTML = `${bar()}<div class="card pad err">${esc(e.message)}<button id="retry">Try again</button></div>`;
    wireBar(); document.getElementById('retry').onclick = route; return;
  }
  if (mine !== view) return;
  const a = inv.activity, max = Math.max(1, ...a.by_year.map(y => y.n));
  const status = !a.deals ? '' : a.last_12m ? '<span class="pillx ok"><span class="dot ok"></span>Active</span>' : `<span class="pillx">Quiet since ${esc(fmtDate(a.last_deal))}</span>`;
  const onRecord = term(`${a.deals} on record`, 'Deals Cala holds with a date and this investor in the investor role. The real number can be higher.');

  $.innerHTML = `${bar()}
    <div class="top">
      <section class="w card frame" style="--i:0"><canvas class="tex"></canvas>
        <div class="id"><div class="av">${esc(initials(inv.name))}</div><div><h1>${esc(inv.name)} ${status}</h1><p>${esc(inv.description || inv.hq || '')}</p></div></div></section>
      <section class="w card pad verdict" style="--i:1" id="verdict"></section>
    </div>
    <div class="cols">
      ${a.deals ? widget(2, 'Activity', `<div class="card pad"><div class="big">${a.last_12m}<small>deals in the last 12 months</small></div>
        <div class="bars">${a.by_year.map((y, i) => `<div>${y.n || ''}<i style="height:${Math.round(y.n / max * 100)}%;animation-delay:${250 + i * 60}ms"></i>${y.year.slice(2)}</div>`).join('')}</div></div>`, onRecord) : ''}
      ${widget(5, 'Ask', `<div class="card pad ask"><form><input placeholder="Ask about ${esc(inv.name)}" aria-label="Ask about ${esc(inv.name)}"><button class="btn">Ask</button></form>
        <div class="chips" style="margin-top:12px" id="sugg"></div></div>`, 'answered by Cala')}
      <div id="answers"></div>
      ${widget(3, 'Latest deals', `<div class="card" id="deals">${a.deals ? skRows(4) : '<div class="empty">Cala has no dated deals for this investor.</div>'}</div>`, a.last_deal ? 'latest ' + esc(fmtDate(a.last_deal)) : '')}
      ${widget(4, 'Portfolio', `<div class="card pad"><div class="big">${inv.portfolio.length}<small>companies backed</small></div><div class="chips" id="port" style="margin-top:16px"></div></div>`)}
      <div id="along"></div>
    </div>
    <div class="foot">Every fact comes from Cala's knowledge graph. Tap a deal to see its sources.</div>`;
  wireBar(); mountTexture();
  portfolio(inv, new Set());
  remember(inv, '', `${inv.portfolio.length} companies · ${a.last_12m} deals in 12 months`);
  askWidget(inv, mine, []);
  verdict(inv, mine);
  if (a.deals) deals(inv, mine);
}

function portfolio(inv, rivalIds, all) {
  const el = document.getElementById('port'); if (!el) return;
  const hit = p => p.ids.some(i => rivalIds.has(i));
  const sorted = [...inv.portfolio].sort((x, y) => hit(y) - hit(x));
  const shown = all ? sorted : sorted.slice(0, 12);
  el.innerHTML = (shown.map(p => `<span class="chip ${hit(p) ? 'bad' : ''}">${esc(p.name)}${hit(p) ? ' · your rival' : ''}</span>`).join('')
    || '<span class="t2">Cala lists no portfolio companies.</span>')
    + (!all && sorted.length > shown.length ? `<button class="chip" id="allp">+${sorted.length - shown.length} more</button>` : '');
  const b = document.getElementById('allp');
  if (b) b.onclick = () => portfolio(inv, rivalIds, true);
}

async function verdict(inv, mine) {
  const el = document.getElementById('verdict');
  const head = (cls, text) => `<span class="pillx ${cls}">${cls ? `<span class="dot ${cls}"></span>` : ''}${text}</span>`;
  if (!me) {
    el.className = 'w card pad verdict';
    el.innerHTML = `<div>${head('', 'Conflict check')}<div class="v">Does ${esc(inv.name)} back your rival?</div><div class="s">Tell us your company and we compare its closest rivals with this portfolio.</div></div>
      <form><input placeholder="Your company" aria-label="Your company"><button class="btn">Check</button></form>`;
    el.querySelector('form').onsubmit = e => { e.preventDefault(); const v = el.querySelector('input').value.trim(); if (v) { me = v; store.set('me', me); route(); } };
    return;
  }
  el.innerHTML = `<div>${head('', 'Conflict check')}<div class="sk" style="height:22px;width:92%;margin-top:16px"></div><div class="sk" style="height:22px;width:60%;margin-top:8px"></div>
    <div class="s">Finding ${esc(me)}'s closest rivals in Cala. The first time can take a minute.</div></div>`;
  let c;
  try { c = await api(`/${inv.id}/conflicts?me=${encodeURIComponent(me)}`); } catch (e) {
    if (mine !== view) return;
    el.innerHTML = `<div>${head('', 'Conflict check')}<div class="s err">${esc(e.message)}<button id="vr">Try again</button></div></div>`;
    document.getElementById('vr').onclick = () => verdict(inv, mine); return;
  }
  if (mine !== view) return;
  const names = c.conflicts.map(x => x.name), rivals = c.rivals.map(r => r.name);
  const rivalTerm = word => term(word, `The closest competitors Cala's graph returns for ${c.company.name}: ${rivals.join(', ')}.`);
  const also = c.already_investor ? ` ${esc(inv.name)} is already an investor in ${esc(c.company.name)}.` : '';
  if (names.length) {
    el.className = 'w card pad verdict bad';
    el.innerHTML = `<div>${head('bad', 'Conflict')}<div class="v">${esc(inv.name)} backs ${esc(names.join(' and '))}, ${rivalTerm(names.length > 1 ? 'direct rivals' : 'a direct rival')} of ${esc(c.company.name)}.</div>
      <div class="s">${also || 'Think about what you share in the meeting.'}</div></div>
      <div class="links" style="border-color:rgba(194,65,45,.18)">${c.conflicts.map(x => srcList(x.sources)).join('')}</div>`;
    remember(inv, 'bad', `Backs ${names.join(', ')}`); tint('bad');
  } else if (!rivals.length) {
    el.innerHTML = `<div>${head('', 'Conflict check')}<div class="v">Cala found no rivals for ${esc(c.company.name)} yet.</div><div class="s">Without rivals there is nothing to compare this portfolio against.</div></div>`;
  } else {
    el.className = 'w card pad verdict ok';
    el.innerHTML = `<div>${head('ok', 'No conflict found')}<div class="v">None of ${esc(c.company.name)}'s ${rivalTerm('direct rivals')} are in this portfolio.</div>
      <div class="s">Checked ${c.portfolio_size} companies.${also}</div></div>`;
    remember(inv, 'ok', 'No rival in portfolio'); tint('ok');
  }
  portfolio(inv, new Set(c.conflicts.map(x => x.portfolio_id)));
  askWidget(inv, mine, names);
}

async function deals(inv, mine) {
  const el = document.getElementById('deals');
  let d;
  try { d = await api(`/${inv.id}/deals`); } catch (e) {
    if (mine !== view) return;
    el.innerHTML = `<div class="pad err">${esc(e.message)}<button id="dr">Try again</button></div>`;
    document.getElementById('dr').onclick = () => { el.innerHTML = skRows(4); deals(inv, mine); }; return;
  }
  if (mine !== view) return;
  el.innerHTML = `<div class="list">${d.deals.map((x, i) => `<button class="row" data-i="${i}" aria-expanded="false">
      <div class="av">${esc(initials(x.company || '?'))}</div>
      <div class="tx"><div class="t1">${esc(x.company || 'Undisclosed company')}</div>
        <div class="t2">${esc([x.round, x.co_investors.length ? 'with ' + x.co_investors.slice(0, 2).join(', ') + (x.co_investors.length > 2 ? ` +${x.co_investors.length - 2}` : '') : ''].filter(Boolean).join(' · ') || 'Funding round')}</div></div>
      <div class="rt"><b>${esc(x.amount || '')}</b>${esc(fmtDate(x.date))}</div>
    </button><div class="srcs" data-s="${i}" hidden>${srcList(x.sources) || 'No source link on this deal.'}</div>`).join('') || '<div class="empty">No deal details available.</div>'}</div>`;
  el.querySelectorAll('button.row').forEach(b => b.onclick = () => {
    const s = el.querySelector(`[data-s="${b.dataset.i}"]`); s.hidden = !s.hidden; b.setAttribute('aria-expanded', !s.hidden);
  });
  if (d.alongside.length) {
    document.getElementById('along').innerHTML = widget(0, 'Invests alongside', `<div class="card list">${d.alongside.map(x => `<a class="row" href="#i/${x.id}"><div class="av">${esc(initials(x.name))}</div>
        <div class="tx"><div class="t1">${esc(x.name)}</div></div><div class="rt">${x.deals} ${x.deals > 1 ? 'deals' : 'deal'}</div>${icon.chev}</a>`).join('')}</div>`, `in the latest ${d.deals.length} deals`);
  }
}

/* ---------- ask: each answer arrives as a new widget ---------- */
function md(text) {
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\[(.+?)\]\((https?:[^)\s]+)\)/g, '$1');
  let html = '', list = false;
  for (const raw of text.split('\n')) {
    const line = raw.trim();
    if (/^\|?[\s:|-]+\|?$/.test(line) && line.includes('-')) continue;
    const item = line.match(/^(?:[-*•]|\d+\.)\s+(.*)/) || (line.startsWith('|') ? [0, line.split('|').map(c => c.trim()).filter(Boolean).join(' · ')] : null);
    if (item) { if (!list) { html += '<ul>'; list = true; } html += `<li>${inline(item[1])}</li>`; continue; }
    if (list) { html += '</ul>'; list = false; }
    if (line) html += `<p>${/^#+\s/.test(line) ? '<b>' + inline(line.replace(/^#+\s/, '')) + '</b>' : inline(line)}</p>`;
  }
  return html + (list ? '</ul>' : '');
}
function askWidget(inv, mine, rivals) {
  const box = document.querySelector('.ask'); if (!box) return;
  const ideas = [rivals.length ? `How close are ${inv.name} and ${rivals[0]}?` : `What does ${inv.name} look for in a company?`,
    `Who are the partners at ${inv.name}?`, `Any controversies around ${inv.name}?`];
  const sugg = document.getElementById('sugg');
  sugg.innerHTML = ideas.map(q => `<button class="chip">${esc(q)}</button>`).join('');
  const input = box.querySelector('input');
  const ask = async q => {
    q = q.trim(); if (!q) return;
    input.value = '';
    const slot = document.createElement('div');
    slot.innerHTML = widget(0, esc(q), `<div class="card pad"><div class="sk" style="height:12px;width:92%"></div><div class="sk" style="height:12px;width:78%;margin-top:10px"></div><div class="sk" style="height:12px;width:55%;margin-top:10px"></div><div class="t2" style="margin-top:12px">Cala is searching its sources. This takes up to a minute.</div></div>`);
    document.getElementById('answers').prepend(slot);
    try {
      const r = await api(`/${inv.id}/ask?q=${encodeURIComponent(q)}`);
      if (mine !== view) return;
      slot.innerHTML = widget(0, esc(q), `<div class="card pad"><div class="answer">${md(r.answer_md) || 'Cala had no answer for this.'}</div>${r.sources.length ? `<div class="links">${srcList(r.sources)}</div>` : ''}</div>`);
    } catch (e) {
      if (mine === view) slot.innerHTML = widget(0, esc(q), `<div class="card pad err">${esc(e.message)}</div>`);
    }
  };
  box.querySelector('form').onsubmit = e => { e.preventDefault(); ask(input.value); };
  sugg.querySelectorAll('button').forEach(b => b.onclick = () => ask(b.textContent));
}

function route() {
  hideTip();
  const m = location.hash.match(/^#i\/([\w-]+)/);
  scrollTo(0, 0);
  if (m) investor(m[1]); else { view++; home(); }
}
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
